<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agents — Senawa</title>
    <link rel="stylesheet" href="mock.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand"><span class="brand-mark">S</span> Senawa</div>
        <div class="run-picker"><b>rpi</b><span>tic-tac-toe in Node.js</span></div>
        <div class="topbar-right">
          <span class="health">live</span>
          <button class="needs-pill" type="button">1 waiting on you</button>
        </div>
      </header>

      <nav class="tabs">
        <button class="tab" type="button" onclick="location.href='index.html'">Workflow</button>
        <button class="tab" type="button" aria-selected="true">Agents</button>
        <button class="tab" type="button" onclick="location.href='artifacts.html'">Artifacts</button>
        <button class="tab" type="button" onclick="location.href='record.html'">Record</button>
      </nav>

      <main>
        <div class="run-head">
          <h1>Agents</h1>
          <span class="run-head request">who is working, and on what</span>
          <span class="elapsed">3 working · 3 done</span>
        </div>

        <div class="split">
          <section class="card">
            <header><h2>This run</h2><span class="count">6</span></header>
            <ul class="tree">
              <li>
                <button class="node" type="button" data-selects="game" aria-current="true">
                  <span class="node-mark">●</span>
                  <span class="node-name">implementor</span>
                  <span class="node-sub">write the game rules module</span>
                  <span class="node-right">
                    <span class="who"><span class="model">sonnet-4.5</span></span>
                    <span class="asks">asks</span>
                    <span class="state is-working">working</span>
                  </span>
                </button>
              </li>
              <li>
                <button class="node" type="button" data-selects="cli">
                  <span class="node-mark">●</span>
                  <span class="node-name">implementor</span>
                  <span class="node-sub">write the command-line entry point</span>
                  <span class="node-right">
                    <span class="who"><span class="model">haiku-4.5</span></span>
                    <span class="state is-working">working</span>
                  </span>
                </button>
              </li>
              <li>
                <button class="node" type="button" data-selects="check">
                  <span class="node-mark">●</span>
                  <span class="node-name">implementor</span>
                  <span class="node-sub">write the check script</span>
                  <span class="node-right">
                    <span class="who"><span class="model">haiku-4.5</span></span>
                    <span class="state is-refused">needs budget</span>
                  </span>
                </button>
              </li>
              <li>
                <button class="node" type="button" data-selects="tests">
                  <span class="node-mark">●</span>
                  <span class="node-name">implementor</span>
                  <span class="node-sub">write the test suite</span>
                  <span class="node-right">
                    <span class="who"><span class="model">haiku-4.5</span></span>
                    <span class="state is-closed">done</span>
                  </span>
                </button>
              </li>
              <li>
                <button class="node" type="button" data-selects="plan">
                  <span class="node-mark">●</span>
                  <span class="node-name">planner</span>
                  <span class="node-sub">break the work into tasks</span>
                  <span class="node-right">
                    <span class="who"><span class="model">haiku-4.5</span></span>
                    <span class="state is-closed">done</span>
                  </span>
                </button>
              </li>
              <li>
                <button class="node" type="button" data-selects="research">
                  <span class="node-mark">●</span>
                  <span class="node-name">researcher</span>
                  <span class="node-sub">understand the request</span>
                  <span class="node-right">
                    <span class="who"><span class="model">haiku-4.5</span></span>
                    <span class="node-sub">4 attempts</span>
                    <span class="state is-closed">done</span>
                  </span>
                </button>
              </li>
            </ul>
          </section>

          <section class="card detail" id="selection"></section>
        </div>
      </main>

      <aside class="rail">
        <section class="card">
          <header><h2>Waiting on you</h2><span class="count">1</span></header>
          <ul class="queue">
            <li>
              <button type="button" data-selects="game">
                <span class="q-where">implement · write the game rules module</span>
                <span class="q-what">Should a draw be reported as a win for nobody, or its own outcome?</span>
              </button>
            </li>
          </ul>
        </section>
      </aside>
    </div>

    <template id="selection-game">
      <header>
        <div class="detail-title">
          <h2>write the game rules module</h2>
          <span class="where">implement · implementor on sonnet-4.5 · attempt 2 · 4m</span>
        </div>
        <div class="detail-actions">
          <button class="ghost" type="button">Steer</button>
          <button class="ghost" type="button">Accept anyway</button>
        </div>
      </header>
      <div class="detail-tabs">
        <button class="detail-tab" type="button" data-group="g" data-pane="g-live" aria-selected="true">Live</button>
        <button class="detail-tab" type="button" data-group="g" data-pane="g-answers">Answers</button>
        <button class="detail-tab" type="button" data-group="g" data-pane="g-made">Produced</button>
      </div>
      <div id="g-live">
        <pre class="terminal"><span class="t-meta">session started · 04:22:26</span>
<span class="t-say">Reading the plan item. It asks for the rules only, with no input
or output of its own, so tests can drive it directly.</span>
<span class="t-tool">write lib/game.mjs</span> <span class="t-meta">3.7 KiB</span>
<span class="t-say">Win detection covers rows, columns and both diagonals. One case
is underspecified and I do not want to guess at it.</span>
<span class="t-ask">Should a draw be reported as a win for nobody, or its own outcome?</span>
<span class="t-meta">waiting for you · 4m</span></pre>
        <div class="reply">
          <span class="reply-caret">›</span>
          <textarea placeholder="Answer the agent directly…" aria-label="Answer"></textarea>
          <div class="reply-side">
            <button class="send" type="button">Send</button>
            <span class="reply-note">read as written · cannot be changed</span>
          </div>
        </div>
      </div>
      <div class="pane" id="g-answers" hidden>
        <ul class="answered">
          <li>
            <p class="a-q">Should players compete against each other, or against the machine?</p>
            <p class="a-a">Two people taking turns on the same keyboard. X moves first.</p>
            <p class="a-when">answered 04:18 · carried into attempt 2</p>
          </li>
        </ul>
      </div>
      <div class="pane" id="g-made" hidden>
        <table class="grid">
          <thead><tr><th>File</th><th class="num">Size</th><th>Written</th></tr></thead>
          <tbody><tr data-record="lib/game.mjs\n  3,773 bytes"><td>lib/game.mjs</td><td class="num">3.7 KiB</td><td>04:22</td></tr></tbody>
        </table>
      </div>
    </template>

    <template id="selection-cli">
      <header>
        <div class="detail-title">
          <h2>write the command-line entry point</h2>
          <span class="where">implement · implementor on haiku-4.5 · attempt 1 · 2m</span>
        </div>
        <div class="detail-actions"><button class="ghost" type="button">Steer</button></div>
      </header>
      <div class="detail-tabs">
        <button class="detail-tab" type="button" data-group="l" data-pane="l-live" aria-selected="true">Live</button>
      </div>
      <div id="l-live">
        <pre class="terminal"><span class="t-meta">session started · 04:24:40</span>
<span class="t-say">Waiting on the rules module before I import from it.</span>
<span class="t-tool">read  lib/game.mjs</span> <span class="t-meta">absent</span>
<span class="t-meta">working · 2m</span></pre>
      </div>
    </template>

    <template id="selection-check">
      <header>
        <div class="detail-title">
          <h2>write the check script</h2>
          <span class="where">implement · implementor on haiku-4.5 · attempt 3 · stopped</span>
        </div>
        <div class="detail-actions"><button class="solid" type="button">Give it more budget</button></div>
      </header>
      <div class="detail-tabs">
        <button class="detail-tab" type="button" data-group="c" data-pane="c-live" aria-selected="true">Live</button>
      </div>
      <div id="c-live">
        <pre class="terminal"><span class="t-meta">session started · 04:24:02</span>
<span class="t-tool">write scripts/check.mjs</span> <span class="t-meta">176 bytes</span>
<span class="t-fail">stopped: this phase has used all 8 of its review attempts</span>
<span class="t-ask">I need 1 more attempt to finish.</span>
<span class="t-meta">waiting for you · 1m</span></pre>
        <div class="reply">
          <span class="reply-caret">›</span>
          <textarea placeholder="Say why you are granting it…" aria-label="Reply"></textarea>
          <div class="reply-side">
            <button class="send" type="button">Grant 24 more</button>
            <span class="reply-note">ceiling 64 · currently 8</span>
          </div>
        </div>
      </div>
    </template>

    <template id="selection-tests">
      <header>
        <div class="detail-title">
          <h2>write the test suite</h2>
          <span class="where">implement · implementor on haiku-4.5 · closed</span>
        </div>
      </header>
      <div class="detail-tabs">
        <button class="detail-tab" type="button" data-group="t" data-pane="t-live" aria-selected="true">Live</button>
      </div>
      <div id="t-live">
        <pre class="terminal"><span class="t-meta">session started · 04:23:55</span>
<span class="t-say">Seventeen cases: every winning line, a full-board draw, and
rejecting a move onto an occupied cell.</span>
<span class="t-tool">write game.test.mjs</span> <span class="t-meta">4.9 KiB</span>
<span class="t-meta">session ended</span></pre>
      </div>
    </template>

    <template id="selection-plan">
      <header>
        <div class="detail-title">
          <h2>break the work into tasks</h2>
          <span class="where">plan · planner on haiku-4.5 · closed</span>
        </div>
      </header>
      <div class="detail-tabs">
        <button class="detail-tab" type="button" data-group="p" data-pane="p-live" aria-selected="true">Live</button>
      </div>
      <div id="p-live">
        <pre class="terminal"><span class="t-meta">session started · 04:23:10</span>
<span class="t-say">Four pieces of work, each independently testable.</span>
<span class="t-tool">senawa_complete</span> <span class="t-meta">plan · 4 tasks</span>
<span class="t-meta">session ended</span></pre>
      </div>
    </template>

    <template id="selection-research">
      <header>
        <div class="detail-title">
          <h2>understand the request</h2>
          <span class="where">research · researcher on haiku-4.5 · 4 attempts · closed</span>
        </div>
      </header>
      <div class="detail-tabs">
        <button class="detail-tab" type="button" data-group="r" data-pane="r-live" aria-selected="true">Live</button>
        <button class="detail-tab" type="button" data-group="r" data-pane="r-answers">Answers</button>
      </div>
      <div id="r-live">
        <pre class="terminal"><span class="t-meta">session started · 04:22:26 · resumed with your answer</span>
<span class="t-say">Node 20, standard library only, two players on one keyboard.
That settles every open point.</span>
<span class="t-tool">senawa_complete</span> <span class="t-meta">research · 3.3 KiB</span>
<span class="t-meta">session ended</span></pre>
      </div>
      <div class="pane" id="r-answers" hidden>
        <ul class="answered">
          <li>
            <p class="a-q">Which Node.js version should the game run on?</p>
            <p class="a-a">Node 20 or newer. Standard library only, ES modules, .mjs.</p>
            <p class="a-when">answered 04:18 from the command line</p>
          </li>
          <li>
            <p class="a-q">Playable in the terminal, or a module tests drive?</p>
            <p class="a-a">Both, kept separate.</p>
            <p class="a-when">answered 04:21 from the portal</p>
          </li>
        </ul>
      </div>
    </template>

    <script src="mock.js"></script>
  </body>
</html>
