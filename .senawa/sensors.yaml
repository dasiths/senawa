version: 1
extensions:
  - package: "@senawa/sensor-artifact"
  - package: "@senawa/sensor-command"
  - package: "@senawa/sensor-task-change"
  - package: "@senawa/sensor-task-acceptance"
sensors:
  - id: task-change
    extension: "@senawa/sensor-task-change"
    kind: deterministic
    description: Confirm that measured task changes satisfy scope and intent
    cost: cheap
    trust: blocking
    scope: []
    config:
      evidenceKind: repository-delta
  - id: task-acceptance
    extension: "@senawa/sensor-task-acceptance"
    kind: deterministic
    description: Confirm that every required acceptance criterion has resolving completion evidence
    cost: cheap
    trust: blocking
    scope: []
    config:
      evidenceKind: task-assessment
  - id: artifact-present
    extension: "@senawa/sensor-artifact"
    kind: deterministic
    description: Confirm that a phase produced its declared artifact
    cost: cheap
    trust: blocking
    scope: []
    config:
      artifactKind: phase-output
  - id: artifact-integrity
    extension: "@senawa/sensor-artifact"
    kind: deterministic
    description: Confirm that a definition or research artifact is internally consistent
    cost: cheap
    trust: blocking
    scope: []
    config:
      artifactKind: cross-reference
  - id: verification-current
    extension: "@senawa/sensor-artifact"
    kind: deterministic
    description: Confirm that current verification passed with resolvable evidence
    cost: cheap
    trust: blocking
    scope: []
    config:
      artifactKind: verification-output
  - id: typecheck
    extension: "@senawa/sensor-command"
    kind: deterministic
    description: Type-check the workspace without emitting files
    cost: cheap
    trust: blocking
    scope: [packages]
    config:
      command: pnpm typecheck
      parser: raw
  - id: unit-tests
    extension: "@senawa/sensor-command"
    kind: deterministic
    description: Run the workspace unit tests
    cost: standard
    trust: blocking
    scope: [packages]
    config:
      command: pnpm test
      parser: raw
      timeoutMs: 600000
gates:
  - id: definition-accepted
    description: Definition artifact is present and schema-valid
    checks:
      - sensor: artifact-present
        expect: { path: /verdict, operator: equals, value: pass }
      - sensor: artifact-integrity
        expect: { path: /verdict, operator: equals, value: pass }
    onFail: block
    escalateOnExhaustion: true
  - id: research-accepted
    description: Research artifact is present and schema-valid
    checks:
      - sensor: artifact-present
        expect: { path: /verdict, operator: equals, value: pass }
      - sensor: artifact-integrity
        expect: { path: /verdict, operator: equals, value: pass }
    onFail: block
    escalateOnExhaustion: true
  - id: plan-accepted
    description: Plan artifact is present and schema-valid
    checks:
      - sensor: artifact-present
        expect: { path: /verdict, operator: equals, value: pass }
    onFail: block
    escalateOnExhaustion: true
  - id: task-done
    description: Completion evidence resolves and the workspace satisfies type-check and test policy
    checks:
      - sensor: task-change
        expect: { path: /verdict, operator: equals, value: pass }
      - sensor: task-acceptance
        expect: { path: /verdict, operator: equals, value: pass }
      - sensor: typecheck
        expect: { path: /verdict, operator: equals, value: pass }
      - sensor: unit-tests
        expect: { path: /verdict, operator: equals, value: pass }
    onFail: rework
    maxRework: 3
    escalateOnExhaustion: true
  - id: work-done
    description: Current verification passes with resolvable, non-contradictory evidence
    checks:
      - sensor: artifact-present
        expect: { path: /verdict, operator: equals, value: pass }
      - sensor: verification-current
        expect: { path: /verdict, operator: equals, value: pass }
    onFail: block
    escalateOnExhaustion: true
frozen:
  - .senawa/sensors.yaml
  - .senawa/agents/**
  - .senawa/workflows/**
  - .senawa/schemas/**
  - .agents/skills/**
  - test/**
  - tests/**