version: 1
extensions:
  - package: "@senawa/sensor-artifact"
  - package: "@senawa/sensor-command"
sensors:
  - id: artifact-present
    extension: "@senawa/sensor-artifact"
    kind: deterministic
    description: Confirm that a phase produced its declared artifact
    cost: cheap
    trust: blocking
    scope: []
    config:
      artifactKind: phase-output
  - id: typecheck
    extension: "@senawa/sensor-command"
    kind: deterministic
    description: Type-check the workspace without emitting files
    cost: cheap
    trust: blocking
    scope: [packages]
    config:
      command: pnpm typecheck
      parser: raw
  - id: unit-tests
    extension: "@senawa/sensor-command"
    kind: deterministic
    description: Run the workspace unit tests
    cost: standard
    trust: blocking
    scope: [packages]
    config:
      command: pnpm test
      parser: raw
gates:
  - id: definition-accepted
    description: Definition artifact is present and schema-valid
    checks:
      - sensor: artifact-present
        expect: { path: /verdict, operator: equals, value: pass }
    onFail: block
    escalateOnExhaustion: true
  - id: research-accepted
    description: Research artifact is present and schema-valid
    checks:
      - sensor: artifact-present
        expect: { path: /verdict, operator: equals, value: pass }
    onFail: block
    escalateOnExhaustion: true
  - id: plan-accepted
    description: Plan artifact is present and schema-valid
    checks:
      - sensor: artifact-present
        expect: { path: /verdict, operator: equals, value: pass }
    onFail: block
    escalateOnExhaustion: true
  - id: task-done
    description: Implementation satisfies workspace type-check and test policy
    checks:
      - sensor: typecheck
        expect: { path: /verdict, operator: equals, value: pass }
      - sensor: unit-tests
        expect: { path: /verdict, operator: equals, value: pass }
    onFail: rework
    maxRework: 3
    escalateOnExhaustion: true
  - id: work-done
    description: Verification artifact is present and schema-valid
    checks:
      - sensor: artifact-present
        expect: { path: /verdict, operator: equals, value: pass }
    onFail: block
    escalateOnExhaustion: true
frozen:
  - .senawa/sensors.yaml
  - .senawa/agents/**
  - .senawa/workflows/**
  - .senawa/schemas/**
  - .agents/skills/**
  - test/**
  - tests/**