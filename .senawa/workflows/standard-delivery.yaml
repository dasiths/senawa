apiVersion: senawa.dev/workflow/v1
kind: Workflow
metadata:
  name: standard-delivery
  description: Define, research, plan, implement, and verify a repository change
spec:
  inputSchema: ../schemas/work-request.schema.json
  completesWhen: verify-accepted
  phases:
    - id: define
      executor:
        kind: agent
        role: definer
        resumeAcrossIterations: true
        output:
          path: artifacts/definition.json
          schema: ../schemas/definition.schema.json
      exit:
        gate: definition-accepted
        approval: human
      iteration:
        max: 5
        onUpstreamChange: flag
    - id: research
      dependsOn: [define]
      executor:
        kind: agent
        role: researcher
        resumeAcrossIterations: true
        input:
          definition: phases.define.output
        output:
          path: artifacts/research.json
          schema: ../schemas/research.schema.json
      exit:
        gate: research-accepted
        approval: human
      iteration:
        max: 5
        onUpstreamChange: flag
    - id: plan
      dependsOn: [research]
      executor:
        kind: agent
        role: planner
        resumeAcrossIterations: true
        input:
          definition: phases.define.output
          research: phases.research.output
        output:
          path: artifacts/plan.json
          schema: ../schemas/plan.schema.json
      actions:
        - kind: import-plan
          source: phases.plan.output
      exit:
        gate: plan-accepted
        approval: human
      iteration:
        max: 5
        onUpstreamChange: flag
    - id: implement
      dependsOn: [plan]
      executor:
        kind: task-frontier
        role: implementor
        selector:
          phase: implement
        repositoryChanges: [required, optional]
        concurrency: 1
        reentrant: true
      loop:
        until: all-selected-tasks-closed
        each:
          gate: task-done
          rework:
            resumeSession: true
            maxAttempts: 3
          dispatch:
            maxFailures: 2
          onExhausted: escalate
      iteration:
        max: 10
        onUpstreamChange: independent
    - id: verify
      dependsOn: [implement]
      executor:
        kind: agent
        role: verifier
        resumeAcrossIterations: true
        input:
          definition: phases.define.output
          research: phases.research.output
          plan: phases.plan.output
          implementation: evidence.implementation
        output:
          path: artifacts/verification.json
          schema: ../schemas/verification.schema.json
      exit:
        gate: work-done
        approval: human
      iteration:
        max: 10
        onUpstreamChange: independent