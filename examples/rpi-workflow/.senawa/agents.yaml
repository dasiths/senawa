# Agent definitions for the research, plan, implement workflow.
#
# A prompt says what the work is. Senawa appends its own operating contract to
# every prompt at dispatch, so nothing here names a senawa command, an output
# file, or how to signal completion.
#
# Defaults, applied unless an agent overrides them:
#   provider: github-copilot
#   session:  run          one conversation across the phases this agent works
#   credits:  30           a session below the host's floor is refused

researcher:
  prompt: prompts/researcher.md
  model: claude-opus-5
  # A run-scoped session carries one conversation across every turn this agent
  # takes, and each question it asks costs another. Thirty credits ran out
  # mid-phase, and a session over its own ceiling can never be resumed: every
  # later turn is refused for the same reason, for ever.
  credits: 90

planner:
  prompt: prompts/planner.md
  model: claude-opus-5
  credits: 60

implementor:
  prompt: prompts/implementor.md
  model: claude-sonnet-5
  # Each piece of work is independent, so a member starts clean rather than
  # inheriting what a sibling was told.
  session: element
  credits: 60
