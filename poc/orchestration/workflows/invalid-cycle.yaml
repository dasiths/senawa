apiVersion: senawa.dev/workflow/v1
kind: Workflow

metadata:
  name: invalid-cycle
  description: A deliberately invalid workflow

spec:
  inputSchema: ../schemas/work-request.schema.json
  phases:
    - id: one
      dependsOn: [two]
      executor: { kind: agent, role: researcher, output: artifacts/one.json }
      exit: { gate: missing-gate }
    - id: two
      dependsOn: [one]
      executor: { kind: task-frontier, role: implementor }
      loop:
        until: all-selected-tasks-closed
